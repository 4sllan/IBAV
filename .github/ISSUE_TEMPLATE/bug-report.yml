name: 🐞 Relatar Bug
description: Relate um bug ou comportamento inesperado no IBAV
title: "[Bug]: "
labels: ["bug"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Obrigado por ajudar a melhorar o IBAV 🙌
        Por favor, preencha os detalhes abaixo.

  - type: dropdown
    id: module
    attributes:
      label: Qual módulo está afetado?
      description: Selecione o componente do sistema onde o bug ocorreu
      options:
        - Cálculo do VJV (Valor Justo do Veículo)
        - Cálculo do IVB (Índice de Valor Brasileiro)
        - Formulário de entrada
        - Página de resultados
        - Compartilhamento
        - Outro
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Descrição do bug
      description: O que aconteceu?
      placeholder: Explique o problema claramente.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Passos para reproduzir
      placeholder: |
        1. Acesse...
        2. Preencha o campo...
        3. Clique em...
        4. Veja o erro...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportamento esperado
      placeholder: O que deveria ter acontecido?
    validations:
      required: true

  - type: textarea
    id: data
    attributes:
      label: Dados utilizados (se aplicável)
      description: Informe os valores usados no teste
      placeholder: |
        Valor FIPE: R$ ...
        Ano: ...
        Quilometragem: ...
        Conservação: ...

  - type: textarea
    id: environment
    attributes:
      label: Ambiente
      description: Informações sobre o seu ambiente
      placeholder: |
        Navegador: Chrome, Firefox, Safari, etc.
        Versão do navegador: ...
        Sistema operacional: Windows, macOS, Linux, etc.
        Dispositivo: Desktop, Mobile, Tablet